name: Build Attache GUI

on:
  push:
    branches: [main]
    paths:
      - 'gui/**'
  pull_request:
    paths:
      - 'gui/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore gui/AttacheGui.csproj

      - name: Publish self-contained single-file exe
        run: |
          dotnet publish gui/AttacheGui.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o gui/dist-win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttacheGui
          path: gui/dist-win/AttacheGui.exe

      - name: Commit built exe
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gui/dist-win/AttacheGui.exe
          git diff --staged --quiet || git commit -m "chore: update AttacheGui.exe [skip ci]"
          git push
